# 云机：lyytx.com 反代（融合方案）
# 注意：备案通过前不要启用本站点（保持域名无解析）

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream next_app {
    server 127.0.0.1:8080;   # frps 映射的家机 Next
    keepalive 32;
}
upstream supabase_api {
    server 127.0.0.1:8081;   # frps 映射的家机 Supabase Kong
    keepalive 16;
}

server {
    listen 80;
    server_name lyytx.com www.lyytx.com;
    # 备案通过、证书就绪后由 certbot 自动改成 301 -> https
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name lyytx.com www.lyytx.com;

    # 证书由 certbot 写入
    ssl_certificate     /etc/letsencrypt/live/lyytx.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lyytx.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 8m;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 维护页兜底：家机/隧道挂掉时不给用户看 Bad Gateway
    error_page 502 503 504 = @maintenance;
    location @maintenance {
        default_type text/html;
        return 503 '<!doctype html><meta charset="utf-8"><title>维护中</title><div style="font-family:system-ui;text-align:center;padding:80px 20px"><h1>服务维护中</h1><p>我们正在恢复服务，请稍后刷新重试。</p></div>';
    }

    location / {
        proxy_pass http://next_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
    }

    # Supabase REST / Auth（供浏览器直连）
    location ~ ^/(rest|auth)/ {
        proxy_pass http://supabase_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
